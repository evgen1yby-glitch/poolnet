name: hub
on:
  push:
    paths: ["hub/**", "web/site/**", "scripts/site_links.py", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", "web/site/**", "scripts/site_links.py", ".github/workflows/hub.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hub/pyproject.toml
      # Some hub tests drive the UI bundle through node.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install sing-box
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.14/sing-box-1.12.14-linux-amd64.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          echo "SINGBOX_BIN=/tmp/sing-box-1.12.14-linux-amd64/sing-box" >> "$GITHUB_ENV"
          /tmp/sing-box-1.12.14-linux-amd64/sing-box version
      - name: install
        run: pip install -e "./hub[dev]"
      - name: ruff
        working-directory: hub
        run: ruff check src tests
      - name: pytest
        working-directory: hub
        run: pytest
