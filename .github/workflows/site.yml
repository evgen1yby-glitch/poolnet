name: site
on:
  push:
    paths: ["web/site/**", "scripts/site_links.py", "scripts/site_smoke.py", "Makefile", ".github/workflows/site.yml"]
  pull_request:
    paths: ["web/site/**", "scripts/site_links.py", "scripts/site_smoke.py", "Makefile", ".github/workflows/site.yml"]

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: make site

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "playwright>=1.50,<2"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/site_smoke.py
