name: pool
on:
  push:
    paths: ["pool/**", ".github/workflows/pool.yml"]
  pull_request:
    paths: ["pool/**", ".github/workflows/pool.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pool/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      # The tests are flat, and `/bin/sh` (what `run:` and npm use) does not
      # expand `**`. The shell expands this explicit pattern before node sees
      # it, so the command works on every Node version the repo supports.
      - run: node --import tsx --test test/*.test.ts
