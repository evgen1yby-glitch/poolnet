[project]
name = "hub"
version = "0.1.0"
description = "Zero-traffic control plane that indexes, verifies, and publishes public proxy configurations as client subscriptions"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# AGPL, not MIT, and the choice is deliberate: this is server software whose
# entire value is the verification pipeline, so the licence that matters is the
# one that keeps a hosted fork's improvements public. Marzban — the closest
# project in this space — made the same call.
keywords = ["vpn", "proxy", "vless", "vmess", "reality", "sing-box", "xray", "subscription", "censorship"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiogram>=3.15",
    "pydantic-settings>=2.4",
    # Clash-format subscription output parses YAML; the import is lazy, but the
    # feature is part of the published API rather than an optional extra.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Starlette's TestClient imports httpx at call time; pytest never does, so
    # a fresh `pip install -e "./hub[dev]"` needs it declared here.
    "httpx>=0.27",
    # FastAPI parses the admin login form through python-multipart. It is a
    # runtime dependency in requirements.txt too; repeating it keeps the dev
    # extra self-contained for CI and fresh virtualenvs.
    "python-multipart>=0.0.9",
    # Pinned: the gate is `ruff check src tests` with this release's rules.
    "ruff==0.6.9",
]

[project.scripts]
hub = "hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
