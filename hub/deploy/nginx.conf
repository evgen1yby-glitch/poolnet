# hub — reverse proxy. Terminate TLS here; the app listens on loopback only.
#
# The subscription endpoint is polled by clients on a short interval, so this is
# a read-mostly, cacheable path: never generate payloads per request.
#
# 8090, not 8080: 8080 is already taken on this host by another service, and
# the hub must bind the one port it is given.

upstream hub_api {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nodes.example.com;

    # TLS: modern profile. No ACME block here; put certbot in front of it.
    ssl_certificate     /etc/letsencrypt/live/nodes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nodes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hub:10m;
    ssl_session_timeout 1d;

    # The payload is public data. Everything else stays out of the logs.
    # Access is logged so a scraping incident can be reconstructed; the token
    # is part of the path, so treat logs as sensitive.
    access_log /var/log/nginx/hub.access.log;
    error_log  /var/log/nginx/hub.error.log warn;

    # Immutable generated files: the generation is content-addressed, so a stale
    # cached generation is still a valid generation.
    location /data/gen- {
        alias /home/dev/freevpn/data/;
        add_header Cache-Control "public, max-age=900";
        add_header X-Content-Type-Options nosniff always;
        # A generated payload is public; serving it does not disclose anything.
        try_files $uri =404;
    }

    location /sub/ {
        proxy_pass http://hub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app enforces per-token and per-subnet rate limits; nginx's own
        # limiter is the first line, sized for clients polling on a schedule.
        limit_req zone=hub_sub burst=20 nodelay;
        limit_req_status 429;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location = /healthz {
        proxy_pass http://hub_api;
        access_log off;
    }

    # The metrics endpoint exposes pool internals; do not publish it.
    location = /metrics {
        allow 127.0.0.1;
        deny all;
    }

    location / {
        proxy_pass http://hub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name nodes.example.com;
    # ACME must be able to answer; everything else redirects.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
