<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PoolNet — панель оператора</title>
<meta name="theme-color" content="#070b13">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<!--
  The operator panel. It reads one JSON document (`/admin/data`) and draws
  tables; it makes no other request and loads nothing from anywhere else.

  The secret is NOT in this page and is not fetched by it — it arrives as a
  request header from the browser or a proxy in front. That is deliberate: a
  panel that fetched its own token would have to store it somewhere the page
  can read, which is a token in the DOM.
-->
<header>
<div class="head">
  <h1><a class="wordmark" href="/"><img class="mark" src="/static/logo.png" alt="" width="32" height="32">PoolNet</a> <span>панель оператора</span></h1>
  <div id="age">загрузка…</div>
</div>
</header>

<main>
<div id="app">
  <p class="caption">Читаю состояние…</p>
</div>
</main>

<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var age = document.getElementById("age");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /// Seconds as a compact duration. `3661` reads as "1.0 ч", which is what an
  /// operator wants when judging whether a generation is stale; "3661 s" makes
  /// them do the division themselves.
  function dur(s) {
    if (s == null) return "—";
    if (s < 90) return Math.round(s) + " с";
    if (s < 5400) return (s / 60).toFixed(1) + " мин";
    if (s < 172800) return (s / 3600).toFixed(1) + " ч";
    return (s / 86400).toFixed(1) + " дн";
  }

  /// A block: a rule across the top, a heading on it, content below.
  function block(title, aside, content) {
    return '<section class="block"><div class="block-head"><h2>' + esc(title) +
      "</h2>" + (aside ? '<span class="aside">' + esc(aside) + "</span>" : "") +
      '</div>' + content + "</section>";
  }

  function table(headers, rows) {
    var head = headers
      .map(function (h) { return '<th class="' + (h[1] || "") + '">' + esc(h[0]) + "</th>"; })
      .join("");
    var body = rows
      .map(function (r) {
        return "<tr>" + r.map(function (c, i) {
          return '<td class="' + (headers[i][1] || "") + '">' + (c && typeof c === 'object' && 'html' in c ? c.html : esc(c)) + "</td>";
        }).join("") + "</tr>";
      })
      .join("");
    return '<div class="tscroll"><table><thead><tr>' + head + "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  //: Stage labels, matching `_last_funnel`'s keys.
  var STAGES = [
    ["raw", "Строк из источников"],
    ["parsed", "Разобрано в конфиги"],
    ["tcp", "Порт отвечает"],
    ["tls", "Рукопожатие проходит"],
    ["config", "Конфиг валиден"],
    ["http", "Трафик реально идёт"]
  ];

  /// The funnel, drawn the same way the landing page draws it: each stage's
  /// bar is its share of the PREVIOUS stage, not of the input.
  ///
  /// The two pages must agree. Scaled against the input, five of six bars are
  /// 0.3–13% wide and the last is invisible, so the operator would see one bar
  /// and the visitor would see a different picture of the same run.
  function funnel(f) {
    if (!f || !f.raw) return "";
    var prev = 0;
    var rows = STAGES.map(function (s, i) {
      var n = f[s[0]] || 0;
      var share = i === 0 ? 100 : prev > 0 ? (n / prev) * 100 : 0;
      var w = n > 0 ? Math.max(1, share) : 0;
      var lost = i === 0 ? 0 : Math.max(0, prev - n);
      prev = n;
      return (
        '<div class="stage" data-stage="' + s[0] + '">' +
        '<div class="stage-k">' + esc(s[1]) + "</div>" +
        '<div class="stage-track"><div class="track"><i' +
        (s[0] === "http" ? ' class="live"' : "") +
        ' style="width:' + w.toFixed(2) + '%"></i></div></div>' +
        '<div class="stage-n">' + n.toLocaleString("ru-RU") + "</div>" +
        '<div class="stage-drop">' +
        (lost ? "−" + lost.toLocaleString("ru-RU") : "") + "</div></div>"
      );
    }).join("");
    return rows;
  }

  //: Статус в JSON — английский (`ok` / `stale` / `fail`), но оператору нужно
  //: знать, ЧТО он означает, а не как поле называется в ответе. Английское
  //: слово посреди русской строки читается как недоделанный перевод.
  var HEALTH = {
    ok: "всё свежее",
    stale: "данные устарели",
    fail: "требует внимания"
  };

  function render(d) {
    var h = d.health || {};
    var state = h.status === "ok" ? "ok" : h.status === "stale" ? "warn" : "fail";
    age.innerHTML =
      '<span class="state" data-s="' + state + '">' +
      esc(HEALTH[h.status] || h.status || "?") + "</span> " +
      esc(h.generation || "нет поколения") + " · " + esc(dur(h.age_s)) + " назад";

    var html = "";
    var s = d.subscriptions || {};
    function stat(label, value, hint) {
      return '<div class="stat"><div class="stat-k">' + esc(label) + '</div>' +
        '<div class="stat-v">' + esc(value == null ? 0 : value) + '</div>' +
        (hint ? '<div class="stat-h">' + esc(hint) + '</div>' : "") + "</div>";
    }
    html += '<div class="stats">' +
      stat("Всего подписок", s.total, "за всё время") +
      stat("Активных", s.active, "сейчас работают") +
      stat("Истекают за 7 дней", s.expiring_7d, "стоит продлить") +
      stat("Истекли", s.expired, "нужен новый ключ") +
      stat("Отозваны", s.revoked, "заблокированы") +
      stat("Выдано за 24 ч", s.issued_24h, "новые") +
      "</div>";

    // Anonymous app installs. Counting unique installation ids, not people:
    // the client id is random and only its digest is stored.
    var a = d.apps || {};
    html += '<div class="stats">' +
      stat("Установок", a.total, "уникальных") +
      stat("Активны 24 ч", a.active_24h, "были в приложении") +
      stat("Активны 7 дней", a.active_7d, "за неделю") +
      stat("Активны 30 дней", a.active_30d, "за месяц") +
      stat("Сейчас с VPN", a.online, "heartbeat < 10 мин") +
      "</div>";
    var appRows = (a.rows || []).map(function (x) {
      var status = x.online
        ? '<span class="state" data-s="ok">сейчас с VPN</span>'
        : x.connected
          ? '<span class="state" data-s="warn">был с VPN</span>'
          : '<span class="state" data-s="off">не подключён</span>';
      return [
        { html: "<code>" + esc(x.id) + "</code>" },
        x.version,
        x.platform,
        x.locale,
        dt(x.first_seen),
        dt(x.last_seen),
        { html: status }
      ];
    });
    var appBreakdown = [];
    (a.by_version || []).forEach(function (x) { appBreakdown.push(esc(x.name) + ": " + x.n); });
    html += block("Приложения", "уникальные установки",
      appRows.length
        ? table([["ID"], ["Версия"], ["Платформа"], ["Язык"], ["Первый запуск"], ["Последняя активность"], ["VPN"]], appRows) +
          '<p class="caption">' + (appBreakdown.length ? 'Версии: ' + appBreakdown.join(" · ") + '. ' : '') +
          'ID — первые 12 символов хеша случайного идентификатора установки; IP и устройство не хранятся.</p>'
        : '<p class="caption">Пока нет heartbeat от приложения. Установите 0.5.2+ и откройте приложение.</p>');

    var diagRows = d.diagnostics || [];
    html += block("Диагностика приложений", diagRows.length + " отчётов",
      diagRows.length
        ? '<div class="diag-list">' + diagRows.map(function (x) {
            var meta = x.meta || "{}";
            return '<details class="diag-item"><summary><code>#' + esc(x.id) + '</code> · ' +
              esc(x.version) + ' · ' + esc(x.platform) + ' · ' + dt(x.created_at) +
              ' · установка ' + esc(x.instance) + '</summary>' +
              '<pre>' + esc(x.logs || '—') + '</pre>' +
              '<p class="caption">Meta: ' + esc(meta) + '</p></details>';
          }).join("") + '</div>'
        : '<p class="caption">Отчётов пока нет. Пользователь отправляет их вручную: Профиль → Отправить логи.</p>');

    // Subscriptions, last: issuing is an action and actions come after state.
    html += block("Подписки", "срок и источник",
      '<form id="issue" class="issue">' +
      '<input name="label" placeholder="метка (необязательно)" maxlength="120" aria-label="Метка">' +
      '<input name="username" placeholder="Telegram username" maxlength="64" aria-label="Получатель">' +
      '<input name="days" type="number" min="1" max="3650" value="7" aria-label="Срок, дней" style="max-width:7rem">' +
      '<select name="source" aria-label="Источник"><option value="panel">панель</option><option value="telegram">телеграм</option><option value="partner">партнёр</option></select>' +
      '<button type="submit" class="btn">Выдать на срок</button>' +
      "</form>" +
      '<p class="caption">Ключ показывается один раз: в базе только SHA-256. Срок — по умолчанию 7 дней. ' +
      'Веб-ключи получают source=web, бот — source из start-payload.</p>');

    function dt(v) { return v ? esc(v.slice(0, 16).replace("T", " ")) : "—"; }
    function tokenState(tok) {
      var map = { active: ["ok", "активна"], expired: ["warn", "истекла"], revoked: ["off", "отозвана"] };
      var x = map[tok.status] || ["off", tok.status || "?"];
      return '<span class="state" data-s="' + x[0] + '">' + esc(x[1]) + "</span>";
    }
    function holder(tok) {
      var bits = [];
      if (tok.username) bits.push("@" + tok.username);
      if (tok.telegram_id) bits.push(String(tok.telegram_id));
      return esc(bits.join(" · ") || "сайт / без аккаунта");
    }
    function sourceLabel(v) {
      return esc(v === "telegram" || v === "bot" ? "телеграм" : v === "web" ? "сайт" : v === "partner" ? "партнёр" : "панель");
    }

    if (d.tokens && d.tokens.length) {
      html += table(
        [["ID"], ["Получатель"], ["Источник"], ["Статус"], ["Выдан"], ["Истекает"], ["Был"], ["", "num"]],
        d.tokens.map(function (tok) {
          var actions = "";
          if (tok.status === "active" || tok.status === "expired") {
            actions += '<button type="button" class="btn mini" data-extend="' + esc(tok.id) + '">продлить</button> ';
          }
          if (tok.status === "active") {
            actions += '<button type="button" class="btn danger mini" data-revoke="' + esc(tok.id) + '">отозвать</button>';
          }
          return [
            { html: "<code>" + esc(tok.id) + "</code>" },
            { html: holder(tok) },
            sourceLabel(tok.source),
            { html: tokenState(tok) },
            dt(tok.created_at),
            tok.expires_at ? dt(tok.expires_at) : "бессрочно",
            dt(tok.last_seen),
            { html: actions }
          ];
        })
      );
    } else {
      html += '<p class="caption">Ни одной подписки не выдано.</p>';
    }

    // Pool, first: it is what the operator opened the panel to see.
    html += block("Пул", "",
      '<div class="pool">' +
      '<div><div class="v m">' + esc(d.pool.verified) + '</div>' +
      '<div class="k label">проверено сейчас</div></div>' +
      '<div><div class="v m">' + esc(d.pool.known) + '</div>' +
      '<div class="k label">известно всего</div></div>' +
      '<div><div class="v m">' + (d.pool.by_country || []).length + '</div>' +
      '<div class="k label">стран</div></div>' +
      '<div><div class="v m">' + (d.sources || []).length + '</div>' +
      '<div class="k label">источников</div></div>' +
      "</div>");

    // The funnel explains the numbers above it, so it comes directly after.
    if (d.funnel && d.funnel.raw) {
      html += block("Воронка последнего прогона", "", '<div class="funnel">' + funnel(d.funnel) + "</div>" +
        '<p class="caption">Каждая ступень отсеивает по своей причине. Источники дают десятки тысяч строк; через все проверки проходит доли процента.</p>');
    }

    if (d.pool.by_country && d.pool.by_country.length) {
      var max = d.pool.by_country.reduce(function (m, r) { return Math.max(m, r.n); }, 0);
      html += block("Страны", d.pool.by_country.length + " всего",
        table(
          [["Страна"], ["Узлов", "num"], ["Доля", "num"]],
          d.pool.by_country.slice(0, 30).map(function (r) {
            return [
              r.name === "unknown" ? "не измерено" : r.name,
              r.n,
              max ? Math.round((r.n / max) * 100) + "%" : "—"
            ];
          })
        ));
    }

    // Sources: which are healthy and which are about to be disabled. A source
    // keeps its URL here — the operator wrote it, and a health table without a
    // name is unusable.
    if (d.sources && d.sources.length) {
      html += block("Источники", "",
        table(
          [["Источник"], ["Состояние"], ["Раундов", "num"], ["Пустых подряд", "num"], ["Последний успех"]],
          d.sources.map(function (s) {
            var st = !s.enabled
              ? '<span class="state" data-s="off">выключен</span>'
              : s.disabled_soon
                ? '<span class="state" data-s="warn">отключится</span>'
                : '<span class="state" data-s="ok">работает</span>';
            return [
              { html: '<div class="url">' + esc(s.url) + "</div>" },
              { html: st },
              s.rounds,
              s.empty_rounds,
              s.last_ok ? esc(s.last_ok.slice(0, 16).replace("T", " ")) : "—"
            ];
          })
        ) +
        '<p class="caption">Источник отключается после 20 пустых раундов подряд — тот же порог, что применяет загрузчик.</p>');
    }

    if (d.generations && d.generations.length) {
      html += block("Поколения", "",
        table(
          [["Поколение"], ["Опубликовано"], ["Payload-ов", "num"], ["Узлов", "num"]],
          d.generations.map(function (g) {
            var current = g.generation === (d.pool || {}).generation;
            return [
              { html: esc(g.generation) + (current ? ' <span class="state" data-s="ok">текущее</span>' : "") },
              g.at ? esc(g.at.slice(0, 16).replace("T", " ")) : "—",
              g.payloads,
              g.nodes
            ];
          })
        ));
    }

    app.innerHTML = html;
  }

  /// Mint a key and show it once.
  ///
  /// The value comes back exactly once — the server stores a digest — so it is
  /// rendered into a block the operator cannot miss, with the full subscription
  /// URL already assembled, rather than into a table cell they might scroll
  /// past. There is no "show it again" action to add later, because the server
  /// genuinely does not have it.
  function mint(form) {
    var data = new URLSearchParams();
    ["label", "username", "days", "source"].forEach(function (k) {
      var el = form.querySelector('[name="' + k + '"]');
      if (el) data.set(k, el.value || "");
    });
    form.querySelector("button").disabled = true;
    fetch("/admin/keys/issue", {
      method: "POST",
      body: data,
      headers: { accept: "application/json" }
    })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        var url = location.origin + "/sub/" + encodeURIComponent(d.token);
        var box = document.createElement("div");
        box.className = "minted";
        box.innerHTML =
          '<div class="k">Ключ выдан. Скопируйте сейчас — второй раз показать нельзя.</div>' +
          '<div class="v">' + esc(d.token) + "</div>" +
          '<div class="k">Happ / Xray (одна страна = один профиль с ротацией):</div>' +
          '<div class="u">' + esc(url) + "?core=xray</div>" +
          '<div class="k">Base64 (полный список):</div>' +
          '<div class="u">' + esc(url) + "?format=base64</div>" +
          '<div class="k">Base64, по одному узлу на страну:</div>' +
          '<div class="u">' + esc(url) + "?format=base64&unique=1</div>" +
          (d.expires_at ? '<div class="k">Истекает: ' + esc(d.expires_at.slice(0, 16).replace("T", " ")) + "</div>" : "");
        form.parentNode.insertBefore(box, form.nextSibling);
        form.querySelector("button").disabled = false;
        form.reset();
        // Reload the tables so the new key appears in the list below.
        load();
      })
      .catch(function (e) {
        form.querySelector("button").disabled = false;
        alert("Не удалось выдать ключ: " + e.message);
      });
  }

  function extend(id) {
    var days = prompt("Продлить на сколько дней?", "7");
    if (!days) return;
    fetch("/admin/keys/extend", {
      method: "POST",
      body: new URLSearchParams({ id: id, days: days }),
      headers: { accept: "application/json" }
    })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.status !== "extended") alert("Ключ не найден"); load(); })
      .catch(function () { alert("Не удалось продлить"); });
  }

  function revoke(id) {
    if (!confirm("Отозвать ключ " + id + "? Он перестанет работать сразу.")) return;
    fetch("/admin/keys/revoke", {
      method: "POST",
      body: new URLSearchParams({ id: id }),
      headers: { accept: "application/json" }
    })
      .then(function (r) { return r.json(); })
      .then(function () { load(); })
      .catch(function () { alert("Не удалось отозвать"); });
  }

  // Delegated, because the buttons are created by `render` on every load and a
  // direct listener would have to be re-attached each time.
  document.addEventListener("click", function (e) {
    var btn = e.target.closest && e.target.closest("[data-revoke]");
    if (btn) revoke(btn.getAttribute("data-revoke"));
    var ext = e.target.closest && e.target.closest("[data-extend]");
    if (ext) extend(ext.getAttribute("data-extend"));
  });
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "issue") {
      e.preventDefault();
      mint(e.target);
    }
  });

  function load() {
  fetch("/admin/data", { headers: { accept: "application/json" } })
    .then(function (r) {
      if (r.status === 403) throw new Error("forbidden");
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      // An expired session and a forbidden panel look the same to a status-code
      // check; the operator has to be told which one they are looking at, and
      // the answer for 403 is now the login page rather than a hint about a
      // header a browser cannot set.
      age.textContent = "";
      if (e.message === "HTTP 403" || e.message === "forbidden") {
        location.href = "/admin/login";
        return;
      }
      app.innerHTML =
        '<p class="error">Не удалось прочитать состояние: ' + esc(e.message) + "</p>";
    });
  }

  load();
})();
</script>
</body>
</html>
