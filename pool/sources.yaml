# Registry of proxy sources.
#
# Every entry describes where raw proxies come from and how to parse them.
# The pipeline never scans the network: it only consumes published lists,
# which keeps outbound behaviour to one request per source per cycle.
#
# Fields:
#   id       stable identifier, used in stats and the disable log
#   url      fetchable URL (redirects are followed, max 3 hops)
#   format   plain  - text lines: ip:port, scheme://ip:port, user:pass@host:port
#             json   - { "data": [ { "ip", "port", "protocols": [...] } ] } (geonode)
#   protocol default protocol when a line carries no scheme
#   enabled  false removes the source without deleting its history
#
# Keep the protocols list in sync with the docs/sources.md health digest.

sources:
