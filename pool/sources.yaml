  # ---------------- getfreeproxy.com (API, key required) ----------------
  # Auth template: ${GFP_API_KEY} is expanded from the environment at load
  # time; without the variable the source is skipped quietly, so public CI
  # without the secret keeps working. Get a key at getfreeproxy.com.
  - id: gfp-http
    url: https://api.getfreeproxy.com/v1/proxies?protocol=http
    format: gfp
    auth: bearer:${GFP_API_KEY}
  - id: gfp-https
    url: https://api.getfreeproxy.com/v1/proxies?protocol=https
    format: gfp
    auth: bearer:${GFP_API_KEY}
  - id: gfp-socks4
    url: https://api.getfreeproxy.com/v1/proxies?protocol=socks4
    format: gfp
    auth: bearer:${GFP_API_KEY}
  - id: gfp-socks5
    url: https://api.getfreeproxy.com/v1/proxies?protocol=socks5
    format: gfp
    auth: bearer:${GFP_API_KEY}

  # ---------------- spys.one (obfuscated HTML, vm-parsed) ----------------
  # Ports are emitted by a packed script; src/parse/spys.ts runs the page's
  # own scripts in a sandbox and recovers them. The mixed list serves the
  # most recent 30 entries; the type-filtered lists serve 500 per request,
  # but only through POST with the rows-per-page form field (GET is the
  # 30-row teaser). The source's own type/anonymity/uptime claims ride along.
  - id: spys-one-en
    url: https://spys.one/en/free-proxy-list/
    format: spys
  - id: spys-one-socks
    url: https://spys.one/en/socks-proxy-list/
    format: spys
    method: post
    body: xpp=5
  - id: spys-one-http
    url: https://spys.one/en/http-proxy-list/
    format: spys
    method: post
    body: xpp=5
  - id: spys-one-anonymous
    url: https://spys.one/en/anonymous-proxy-list/
    format: spys
    method: post
    body: xpp=5

  # ---------------- advanced.name (base64 attributes, 5 pages) ----------------
  # 100 rows per page, address/port base64-encoded in td attributes; the
  # source publishes its own type and country, which we carry as claims.
  - id: advname-1
    url: https://advanced.name/freeproxy?page=1
    format: advname
  - id: advname-2
    url: https://advanced.name/freeproxy?page=2
    format: advname
  - id: advname-3
    url: https://advanced.name/freeproxy?page=3
    format: advname
  - id: advname-4
    url: https://advanced.name/freeproxy?page=4
    format: advname
  - id: advname-5
    url: https://advanced.name/freeproxy?page=5
    format: advname

  # ---------------- roundproxies.com (public JSON API, 8x500) ----------------
  # /api/get-free-proxies returns the whole pool the "Download all" button
