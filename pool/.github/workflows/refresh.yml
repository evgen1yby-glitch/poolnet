name: refresh

# The full public pipeline. GitHub-hosted runners are used for validation on
# purpose: their egress IPs are disposable, so the operator's own server and
# addresses never appear in proxy-owner logs. Standard runners are free for
# public repositories.

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      maxNewPerCycle:
        description: candidate cap for this run
        default: '200000'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: fetch + parse + dedupe
        env:
          OPP_MAX_NEW_PER_CYCLE: ${{ github.event.inputs.maxNewPerCycle || '200000' }}
          # optional: enables the getfreeproxy.com sources; without it they
          # are skipped quietly and the cycle runs on the rest
          GFP_API_KEY: ${{ secrets.GFP_API_KEY }}
          # automatic: lets the fetch date every GitHub-hosted source (60 req/h
          # unauthenticated is too few for ~160 files), which is how abandoned
          # sources get flagged instead of silently rotting
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx src/index.ts fetch
      - uses: actions/upload-artifact@v4
        with:
          name: candidates
          path: .work/candidates.jsonl.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: fetch-report
          path: data/fetch-report.json
          if-no-files-found: error

  validate:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ulimit -n 65535 || true
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: pool-state-${{ github.run_id }}
          restore-keys: |
            pool-state-
      - uses: actions/download-artifact@v4
        with:
          name: candidates
          path: .work
      - name: validate shard ${{ matrix.shard }}
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
          OPP_CONCURRENCY: 250
        run: npx tsx src/index.ts validate
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shard }}
          path: |
            .work/results-${{ matrix.shard }}.jsonl.gz
            .work/validate-report-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPP_MAX_NEW_PER_CYCLE: ${{ env.OPP_MAX_NEW_PER_CYCLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: .work
      - uses: actions/download-artifact@v4
        with:
          name: candidates
          path: .work
      - uses: actions/download-artifact@v4
        with:
          name: fetch-report
          path: data
      - name: restore pool snapshot from cache
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: pool-state-${{ github.run_id }}
          restore-keys: |
            pool-state-
      - name: merge, enrich, publish
        run: npx tsx src/index.ts merge
      - name: commit published data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # another workflow may have pushed while this ran: rebase and retry
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "push rejected (attempt $i), retrying after a backoff"
            sleep $((i * 10))
          done
      # after the push: the snapshot is an optimisation, losing it must never lose data
      - name: save pool snapshot for the next run
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .state
          key: pool-state-${{ github.run_id }}
